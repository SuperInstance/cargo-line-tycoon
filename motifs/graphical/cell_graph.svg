    <text x="250" y="240" fill="#ffb86c" font-family="monospace" font-size="9" text-anchor="middle">0xb7c4...0d3</text>
    <rect x="370" y="60" width="100" height="60" rx="6" fill="#131826" stroke="#bd93f9" stroke-width="2"/>
